<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Pro Bénin - SaaS Business</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa}
header{background:#0f172a;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:100}
.badge{padding:6px 12px;border-radius:20px;font-size:13px}
.badge-free{background:#e5e7eb;color:#111}
.badge-pro{background:#22c55e;color:white}
.card{background:white;border-radius:12px;padding:16px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{background:#0f172a;color:white;padding:12px;border-radius:8px;border:none;cursor:pointer;width:100%;font-weight:bold;margin-top:8px}
.btn-pay{background:#f59e0b;color:#000}
.grid-pricing{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.grid-pricing{grid-template-columns:1fr}}
.paywall{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.paywall-box{background:white;border-radius:16px;padding:24px;max-width:500px;width:100%;text-align:center}
.price{font-size:28px;font-weight:900;margin:8px 0}
</style>
</head>
<body>
<header>
<h2>🔧 Garage Pro Bénin - SaaS</h2>
<div id="aboInfo"></div>
</header>

<div id="paywall" class="paywall" style="display:none">
<div class="paywall-box">
<h2>🚀 Votre essai est terminé</h2>
<p>Choisissez un abonnement pour continuer :</p>
<div class="grid-pricing">
<div class="card"><h3>Gratuit</h3><p class="price">0F</p><p>5 clients<br>1 facture/jour</p><button class="btn" onclick="choisirAbo('gratuit',0,5)">Rester Gratuit</button></div>
<div class="card" style="border:2px solid #f59e0b"><h3>Starter ⭐</h3><p class="price">5.000F</p><p>100 clients<br>Factures illimitées<br>WhatsApp</p><button class="btn btn-pay" onclick="choisirAbo('starter',5000,100)">Payer MoMo</button></div>
<div class="card"><h3>Pro</h3><p class="price">12.000F</p><p>Illimité<br>Compta + Stats</p><button class="btn btn-pay" onclick="choisirAbo('pro',12000,99999)">Payer 12.000F</button></div>
</div>
<p style="font-size:11px;color:#666">Paiement MTN / Moov / Celtiis via Fedapay</p>
</div>
</div>

<div id="app"></div>

<script>
// ===== SAAS BUSINESS LOGIC =====
function getAbo(){ return JSON.parse(localStorage.getItem('garage_abo')||'null'); }
function setAbo(plan,prix,limite){
 let exp=new Date(); exp.setDate(exp.getDate()+ (plan==='essai'?7:30));
 let abo={plan,prix,limite,expiry:exp.toISOString(),clients:0};
 localStorage.setItem('garage_abo',JSON.stringify(abo)); return abo;
}
function checkAbo(){
 let abo=getAbo(); let info=document.getElementById('aboInfo'); let wall=document.getElementById('paywall');
 if(!abo){ abo=setAbo('essai',0,50); }
 let now=new Date(); let exp=new Date(abo.expiry);
 let joursRest=Math.ceil((exp-now)/1000/60/60/24);
 if(now>exp){ wall.style.display='flex'; info.innerHTML=`<span class="badge badge-free">⛔ Expiré (${abo.plan})</span>`; return false; }
 else{
   wall.style.display='none';
   if(abo.plan==='essai') info.innerHTML=`<span class="badge badge-free">🎁 Essai ${joursRest}j restants</span> <button onclick="document.getElementById('paywall').style.display='flex'" style="margin-left:8px;background:#f59e0b;border:none;padding:4px 10px;border-radius:6px;cursor:pointer">Passer Pro</button>`;
   else info.innerHTML=`<span class="badge badge-pro">✅ ${abo.plan.toUpperCase()} - ${joursRest}j restants</span>`;
   return true;
 }
}
function choisirAbo(plan,prix,limite){
 if(prix===0){ setAbo(plan,prix,limite); checkAbo(); alert('Plan gratuit activé'); return; }
 let num=prompt(`Paiement ${prix} FCFA pour ${plan.toUpperCase()}\nNuméro MoMo (97...):`);
 if(!num) return;
 // ICI ON BRANCHERA FEDAPAY - POUR L'INSTANT MODE TEST
 alert(`[TEST] Paiement ${prix}F demandé à ${num} - Validé !\nProchaine étape: brancher Fedapay`);
 let abo=setAbo(plan,prix,limite); checkAbo();
}
function payer(prix,client){
 let abo=getAbo();
 if(abo && abo.clients>=abo.limite){ alert(`Limite ${abo.limite} clients atteinte pour ${abo.plan}. Upgrade !`); document.getElementById('paywall').style.display='flex'; return; }
 let num=prompt('Numéro MoMo du client ?'); if(num){ if(abo){abo.clients++; localStorage.setItem('garage_abo',JSON.stringify(abo));} alert('Paiement '+prix+' demandé à '+num); }
}
function whatsapp(tel,client,prix){
 let msg=`Bonjour ${client}, Garage AHOUNGAN: Votre facture de ${prix} FCFA est prête. Merci! 🔧`;
 let url=`https://wa.me/229${tel.replace(/\s/g,'')}?text=${encodeURIComponent(msg)}`;
 window.open(url,'_blank');
}
function render(){ document.getElementById('app').innerHTML=`<div class="card"><h3>Gestion Garage</h3><p>Ton app fonctionne ici avec limite SaaS</p><button class="btn" onclick="payer(15000,'Client Test')">Tester Payer 15.000F</button><button class="btn" style="background:#25D366" onclick="whatsapp('97000000','Client Test',15000)">Tester WhatsApp</button><button class="btn" style="background:#eee;color:#000" onclick="localStorage.clear();location.reload()">Reset Essai (test)</button></div>`; }
checkAbo(); render(); setInterval(checkAbo,60000);
</script>
</body>
</html>
